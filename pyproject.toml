[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instaterminal"
version = "1.0.0"
description = "100% Real Instagram Terminal CLI & Downloader (Desktop & Android Termux)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.9.0",
    "instagrapi>=2.1.2",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
instaterminal = "instaterminal.app:run_cli"
insta = "instaterminal.app:run_cli"

[tool.pytest.ini_options]
pythonpath = ["."]
